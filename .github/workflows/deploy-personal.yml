name: Deploy Personal Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/personal/**'
      - 'packages/**'
      - '.github/workflows/deploy-personal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-personal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:personal

      - name: Deploy to callsea1/seanpcallahan.net
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GH_PAGES_TOKEN }}
          repository-name: callsea1/seanpcallahan.net
          branch: gh-pages
          folder: apps/personal/build
          clean: true
          single-commit: true
